name: Build RC3000 OpenWrt firmware

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt version tag to build'
        required: false
        default: 'v25.12.5'
      enable_patches:
        description: 'Apply optional kernel patches (blsp0_uart0 serial)'
        required: false
        default: '0'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show info
        run: |
          df -h /
          nproc
          free -h

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync unzip zlib1g-dev file wget curl libelf-dev libtool-bin

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git fetch --depth 1 origin tag "${{ github.event.inputs.openwrt_version }}"
          git checkout "${{ github.event.inputs.openwrt_version }}"
          git log -1 --oneline

      - name: Install RC3000 DTS and device definition
        run: |
          cd openwrt
          cp ../ipq5018-rc3000.dts target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/
          cat ../ipq50xx.mk.fragment >> target/linux/qualcommax/image/ipq50xx.mk
          echo '--- DTS in place ---'
          ls -la target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq5018-rc3000.dts
          echo '--- mk tail ---'
          tail -25 target/linux/qualcommax/image/ipq50xx.mk

      - name: Apply optional kernel patches
        if: github.event.inputs.enable_patches == '1'
        run: |
          cd openwrt
          cp ../patches-6.12/*.patch target/linux/qualcommax/patches-6.12/
          echo '--- installed ---'
          ls target/linux/qualcommax/patches-6.12/ | grep 9999 || echo '(none)'

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          printf '%s\n' \
            'CONFIG_TARGET_qualcommax=y' \
            'CONFIG_TARGET_qualcommax_IPQ50XX=y' \
            'CONFIG_TARGET_MULTI_PROFILE=y' \
            'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' \
            'CONFIG_TARGET_ROOTFS_INITRAMFS=y' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            'CONFIG_TARGET_KERNEL_GZIP=y' \
            'CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y' \
            'CONFIG_PACKAGE_ipq-wifi-cmcc_mr3000d-ci=y' \
            'CONFIG_PACKAGE_kmod-ath11k-ahb=y' \
            'CONFIG_PACKAGE_kmod-qca-nss-dp=y' \
            'CONFIG_PACKAGE_kmod-leds-gpio=y' \
            'CONFIG_PACKAGE_kmod-gpio-button-hotplug=y' \
            'CONFIG_PACKAGE_wpad-basic-mbedtls=y' \
            'CONFIG_PACKAGE_luci=y' \
            'CONFIG_PACKAGE_luci-mod-admin-full=y' \
            'CONFIG_PACKAGE_luci-mod-network=y' \
            'CONFIG_PACKAGE_luci-mod-system=y' \
            'CONFIG_PACKAGE_dropbear=y' \
            'CONFIG_PACKAGE_firewall4=y' \
            'CONFIG_PACKAGE_dnsmasq-full=y' > .config
          make defconfig

      - name: Download
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1

      - name: Compile
        run: |
          cd openwrt
          make -j$(nproc) 2>&1 | tee build.log

      - name: Collect
        if: success()
        run: |
          cd openwrt
          mkdir -p /tmp/out
          cp bin/targets/qualcommax/ipq50xx/*rc3000* /tmp/out/ 2>/dev/null || true
          cp build.log /tmp/out/ 2>/dev/null || true
          cp .config /tmp/out/config.rc3000 2>/dev/null || true
          ls -la /tmp/out

      - name: Upload firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rc3000-openwrt-${{ github.event.inputs.openwrt_version }}
          path: /tmp/out/*
          retention-days: 30
          if-no-files-found: error
